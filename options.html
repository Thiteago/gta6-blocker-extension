<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>No GTA VI Spoilers — Options</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #ffffff;
    color: #1f2328;
    max-width: 480px;
    margin: 24px auto;
    padding: 0 16px;
  }
  h1 { font-size: 18px; margin-bottom: 4px; }
  p.subtitle { color: #59636e; font-size: 13px; margin-top: 0; }
  section { margin-top: 24px; }
  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: 0.03em; color: #59636e; }
  .site-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 0;
    border-bottom: 1px solid #f0f2f4;
  }
  .term-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
  .term-row { display: flex; align-items: center; gap: 8px; }
  .term-row span { flex: 1; font-size: 13px; }
  button {
    border: none;
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .btn-danger { background: #ffebe9; color: #cf222e; }
  .btn-primary { background: #1f883d; color: #fff; }
  .btn-secondary { background: #f6f8fa; color: #1f2328; border: 1px solid #d0d7de; }
  form.add-term { display: flex; gap: 8px; margin-top: 8px; }
  form.add-term input {
    flex: 1;
    padding: 6px 8px;
    border: 1px solid #d0d7de;
    border-radius: 6px;
    font-size: 13px;
  }
  #status { font-size: 12px; color: #1f883d; height: 16px; margin-top: 12px; }
  footer { margin-top: 24px; }
</style>
</head>
<body>
  <h1>No GTA VI Spoilers</h1>
  <p class="subtitle">Choose which sites and terms trigger the blur.</p>

  <section>
    <h2>Sites</h2>
    <div id="sites"></div>
  </section>

  <section>
    <h2>Blocked terms</h2>
    <div id="terms" class="term-list"></div>
    <form class="add-term" id="add-term-form">
      <input type="text" id="new-term" placeholder="Add a term, e.g. Vice City" />
      <button type="submit" class="btn-primary">Add</button>
    </form>
  </section>

  <footer>
    <button id="reset" class="btn-secondary">Reset to defaults</button>
    <div id="status"></div>
  </footer>

  <script type="module" src="options.js"></script>
</body>
</html>
