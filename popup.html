<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>No GTA VI Spoilers</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    width: 260px;
    padding: 16px;
    color: #1f2328;
  }
  h1 { font-size: 15px; margin: 0 0 12px; }
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  #count {
    font-size: 13px;
    color: #59636e;
    margin-bottom: 12px;
  }
  #count strong { color: #1f2328; }
  button {
    width: 100%;
    border: none;
    border-radius: 6px;
    padding: 8px;
    font-size: 13px;
    cursor: pointer;
    background: #f6f8fa;
    color: #1f2328;
    border: 1px solid #d0d7de;
  }
</style>
</head>
<body>
  <h1>No GTA VI Spoilers</h1>
  <div class="toggle-row">
    <span>Enabled</span>
    <input type="checkbox" id="enabled-toggle" />
  </div>
  <div id="count">Hidden on this page: <strong id="count-value">0</strong></div>
  <button id="open-options">Manage sites &amp; terms</button>
  <script type="module" src="popup.js"></script>
</body>
</html>
